<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Редактор — QQ.XABAR</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="article-page">
    <header class="site-header">
      <div class="container site-nav">
        <a class="logo" href="index.html"
          ><span class="qq"><i>Q</i><b>Q</b></span
          ><span class="logo-dot">.</span
          ><span class="logo-name">XABAR</span></a
        ><a class="back-link" href="index.html"
          ><i class="bi bi-arrow-left"></i> На главную</a
        >
      </div>
    </header>
    <main class="container profile-page">
      <span class="eyebrow">Редактор</span>
      <h1>Добавить новость</h1>
      <p class="article-lead">
        Карточка сохранится в этом браузере и появится первой на главной
        странице.
      </p>
      <form id="adminForm" class="admin-form">
        <label>Заголовок<input id="adminTitle" name="title" required /></label
        ><label
          >Категория<select id="adminCategory" name="category">
            <option>Общество</option>
            <option>Политика</option>
            <option>Экономика</option>
            <option>Технологии</option>
            <option>Спорт</option>
            <option>Культура</option>
          </select></label
        ><label
          >Краткое описание<textarea
            id="adminDescription" name="description"
            required
          ></textarea></label
        ><label
          >Путь к изображению<input
            id="adminImage" name="image"
            required
            placeholder="images/my-news.jpg" /></label
        ><button>Опубликовать</button>
      </form>
      <p id="adminMessage" class="form-message"></p>
    </main>
    <footer><div class="container copyright">© 2026 QQ.XABAR.</div></footer>
    <script src="editor.js"></script>
  </body>
</html>
